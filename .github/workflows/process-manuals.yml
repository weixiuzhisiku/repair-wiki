name: 全与修

on:
  push:
    paths:
      - "raw_manuals/**"
      - "!**/*.md"

jobs:
  流程:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install siliconflow -U
          pip install PyMuPDF python-docx openpyxl

      - name: 处理文件并调用模型
        env:
          SILICON_API_KEY: ${{ secrets.SILICON_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          python <<EOF
          import os
          import fitz  # PyMuPDF
          import docx
          import pandas as pd
          from siliconflow import Client
          
          # 1. 获取环境变量
          api_key = os.getenv("SILICON_API_KEY")
          model_name = os.getenv("MODEL_NAME")
          
          if not api_key or not model_name:
              print("错误：环境变量 SILICON_API_KEY 或 MODEL_NAME 未设置！")
              exit(1)
          
          client = Client(api_token=api_key)
          
          # 2. 遍历 raw_manuals 目录
          input_dir = "raw_manuals"
          output_dir = "processed_manuals"
          os.makedirs(output_dir, exist_ok=True)
          
          for root, dirs, files in os.walk(input_dir):
              for file in files:
                  try:
                      file_path = os.path.join(root, file)
                      print(f"正在处理: {file_path}")
                      
                      # 3. 根据文件类型提取文本
                      text = ""
                      if file.lower().endswith(".pdf"):
                          doc = fitz.open(file_path)
                          text = " ".join([page.get_text() for page in doc])
                          doc.close()
                      elif file.lower().endswith(".docx"):
                          doc = docx.Document(file_path)
                          text = " ".join([para.text for para in doc.paragraphs])
                      elif file.lower().endswith((".xlsx", ".xls")):
                          df = pd.read_excel(file_path)
                          text = df.to_string()
                      else:
                          continue  # 跳过不支持的格式
                      
                      # 4. 调用 Qwen3 模型进行处理
                      prompt = f"""你是一个专业的电器维修专家。请解析以下文档内容，提取关键的维修步骤、故障代码、零部件清单和安全警告。保持格式清晰，使用中文回答。
                      
                      文档内容：
                      {text[:4000]}..."""
                      
                      response = client.chat.completions.create(
                          model=model_name,
                          messages=[{"role": "user", "content": prompt}]
                      )
                      
                      result = response.choices[0].message.content
                      
                      # 5. 保存结果为 Markdown
                      output_path = os.path.join(output_dir, f"{os.path.splitext(file)[0]}.md")
                      with open(output_path, "w", encoding="utf-8") as f:
                          f.write(result)
                          
                      print(f"成功处理: {file} -> 已保存至 {output_path}")
                      
                  except Exception as e:
                      print(f"处理 {file} 时出错: {e}")
                      continue
          EOF

