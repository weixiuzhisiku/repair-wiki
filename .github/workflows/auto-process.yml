name: Auto Process with Qwen3-VL-32B

on:
  push:
    paths:
      - 'uploads/**'
      - 'raw_manuals/**'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests Pillow
      
      - name: Process with Qwen3-VL-32B
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          mkdir -p knowledge_texts processed
          python .github/scripts/extract_text.py
      
      - name: Build index
        run: python .github/scripts/build_index.py
      
      - name: Commit results
        run: |
          git config user.name "AI-Brain"
          git config user.email "brain@ai.local"
          git add -A
          git diff --staged --quiet || (git commit -m "🧠 Processed by Qwen3-VL-32B" && git push)
